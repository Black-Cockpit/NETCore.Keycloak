name: Build test and analyze
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions:
  contents: read

jobs:
  # Build test and analyze source code
  build_test_analyze:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        java-version: [21]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup OpenJDK
      - name: Setup OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java-version }}

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Install the supported .NET SDK
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and test without repository secrets
        run: |
          cp LICENSE NETCore.Keycloak.Client/
          dotnet build NETCore.Keycloak.slnx --configuration Release
          dotnet test NETCore.Keycloak.slnx --configuration Release --no-build \
            --filter 'TestCategory=CoverageUnit' --logger 'trx;LogFileName=unit.trx' \
            --results-directory NETCore.Keycloak.Client.Tests/obj/build-verification

      - name: Detect Sonar analysis availability
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          if [[ -n "$SONAR_TOKEN" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Sonar analysis requires an upstream secret. Build/unit tests and the independent compatibility workflow still run.'
          fi

      # Sonar credentials are unavailable to fork pull requests.
      - name: Install dependencies
        if: steps.sonar.outputs.available == 'true'
        run: |
          sudo apt install -y make
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global Cake.Tool
          dotnet tool install --global JetBrains.dotCover.CommandLineTools

      # Build test and analyze the project
      - name: Build test and analyze the project
        if: steps.sonar.outputs.available == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          VIRTUAL_ENV_DIR: keycloak.venv
        run: |
          # Copy Licence
          cp LICENSE NETCore.Keycloak.Client/

          # Build, test and analyze project with keycloak version 26
          cd NETCore.Keycloak.Client.Tests
          dotnet cake build_test_analyse.cake --kc_major_version=26 --sonar_token="${SONAR_TOKEN}"
