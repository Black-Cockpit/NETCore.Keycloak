version: 3

# Run dotnet restore NETCore.Keycloak.slnx before CLI analysis. The NuGet
# analyzer reads obj/project.assets.json, so do not exclude that directory.
# Published library scope. Test infrastructure has its own inventory in
# .fossa-tests.yml and is also audited in the compatibility workflow.
# Select these scopes in FOSSA Quick Import if that integration does not
# consume CLI configuration; changing this file alone does not change policy.
paths:
  only:
    - NETCore.Keycloak.Client
  exclude:
    - "**/bin/**"
targets:
  exclude:
    # Generated package manifests duplicate the restored project graph.
    - type: nuspec
